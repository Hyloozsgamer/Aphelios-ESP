<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Glowing aura -->
    <circle cx="50" cy="50" r="45" fill="rgba(138,43,226,0.3)" filter="blur(5px)"/>
    
    <circle cx="50" cy="40" r="22" fill="#d9d2e9"/> <!-- Head -->
    <path d="M 25 95 L 40 45 L 60 45 L 75 95 Z" fill="#d9d2e9" opacity="0.8"/> <!-- Body -->
    
    <!-- Face/Eyes glowing -->
    <circle cx="42" cy="40" r="4" fill="#00ffff" filter="drop-shadow(0 0 2px #00ffff)"/>
    <circle cx="58" cy="40" r="4" fill="#00ffff" filter="drop-shadow(0 0 2px #00ffff)"/>
    
    <!-- Hair -->
    <path d="M 30 20 C 50 0, 70 20, 80 50 C 70 30, 50 15, 30 20 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 70 20 C 50 0, 30 20, 20 50 C 30 30, 50 15, 70 20 Z" fill="#ffffff" opacity="0.9"/>
</svg>
